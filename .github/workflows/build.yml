name: Build WandryHP
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Compilar
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --console=plain 2>&1 | tee /tmp/build.log
      - name: Erros detalhados
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          t=open('/tmp/build.log').read().splitlines()
          out=[]
          for i,l in enumerate(t):
              if re.search(r'error:|warning: \[|FAILED|What went wrong', l):
                  out.append(' | '.join(x.strip() for x in t[i:i+4]))
          msg='%0A'.join(out[:60])
          print('::error title=ERROS::'+msg)
          PY
      - name: Resumo do erro
        if: failure()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -v '^$' /tmp/build.log | tail -40 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: wandryhp-jar
          path: |
            build/libs/wandryhp-*.jar
            !build/libs/*-sources.jar
